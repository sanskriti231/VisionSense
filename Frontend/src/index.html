<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vision Sense</title>
  <style>
    .marquee-container{overflow:hidden;}
    .marquee{display:inline-block;white-space:nowrap;will-change:transform;animation:marquee 10s linear infinite;transition:color .3s linear}
    @keyframes marquee{0%{transform:translateX(100vw)}100%{transform:translateX(-100vw)}}
  </style>
  <script src="script.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="input.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Neucha&display=swap" rel="stylesheet">
</head>

<body class="bg-neutral-900 text-white min-h-screen flex items-center justify-center">

  <div class="text-center px-4">

    <!-- Main Heading -->
    <div class="marquee-container">
      <h1 class="marquee text-12xl md:text-8xl font-extrabold tracking-wider bbh-hegarty-bold">
        Vision Sense
      </h1>
    </div>

    <!-- Subheading -->
    <p class="text-lg md:text-xl font-[Neucha] text-gray-400 max-w-xl mx-auto">
      Let the AI describe your image.
    </p>

    <!-- Upload Section -->
    <div class="mt-8 flex flex-col items-center gap-4">
      
      <input
  type="file"
  id="imageInput"
  accept="image/*"
  class="block w-full max-w-xs text-sm text-gray-300
        file:mr-4 file:py-2 file:px-4
        file:rounded-full file:border-0
        file:text-sm file:font-semibold
        file:bg-white file:text-black
        hover:file:bg-gray-200"
        />
        
        <button
        id="uploadBtn"
        class="mt-2 px-6 py-2 rounded-full bg-white text-black font-medium
        hover:bg-gray-200 transition"
        >
        Upload Image
        </button>
        
        <img id="preview" class="hidden mt-6 rounded-lg max-w-xs" />

         <p id="error" class="mt-2 text-red-400 hidden" role="alert" aria-live="polite"></p>
         <p id="result" class="mt-4 text-gray-400"></p>

</div>

</div>

</body>
</html>
